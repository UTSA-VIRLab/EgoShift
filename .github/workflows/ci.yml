name: artifact-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `test` brings pytest: the suite mixes unittest.TestCase classes with
      # pytest-style module-level tests, and `unittest discover` collects zero
      # tests from the latter without reporting it. `full` brings numpy, scipy
      # and Pillow so the image and geometry tests run instead of skipping.
      - run: python -m pip install -e ".[test,full]"
      - run: make check
